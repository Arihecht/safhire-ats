<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safhire ATS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f11; --surface: #17171a; --surface2: #1e1e22;
    --border: #2a2a30; --border2: #333339;
    --text: #f0f0f2; --text2: #9090a0; --text3: #5a5a6a;
    --accent: #7c6aff; --accent2: #a695ff;
    --green: #3dd68c; --green-bg: rgba(61,214,140,0.1);
    --amber: #f5a623; --amber-bg: rgba(245,166,35,0.1);
    --red: #ff5c6a; --red-bg: rgba(255,92,106,0.1);
    --blue: #4da6ff; --blue-bg: rgba(77,166,255,0.1);
    --purple-bg: rgba(124,106,255,0.1);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  .header {
    border-bottom: 1px solid var(--border); padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 100; gap: 12px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-weight: 600; font-size: 15px; color: var(--text); }
  .logo span { color: var(--accent2); }
  .role-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--purple-bg); color: var(--accent2); font-family: 'DM Mono', monospace; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header-stats { display: flex; gap: 20px; }
  .stat { text-align: center; }
  .stat-num { font-size: 17px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
  .upload-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px dashed var(--border2);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
    color: var(--text2); font-size: 13px; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .upload-btn input { display: none; }

  .main { display: flex; height: calc(100vh - 57px); }
  .sidebar { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
  .sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
  .search-box {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; margin-bottom: 8px;
  }
  .search-box::placeholder { color: var(--text3); }
  .search-box:focus { border-color: var(--accent); }
  .filter-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-btn {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--text2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }

  .candidate-card { padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .candidate-card:hover { background: var(--surface2); }
  .candidate-card.active { background: var(--surface2); border-left: 2px solid var(--accent); padding-left: 14px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 5px; gap: 8px; }
  .cand-name { font-weight: 500; font-size: 13px; }
  .cand-location { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .status-new { background: var(--blue-bg); color: var(--blue); }
  .status-reviewing { background: var(--amber-bg); color: var(--amber); }
  .status-shortlisted { background: var(--purple-bg); color: var(--accent2); }
  .status-interviewed { background: rgba(61,214,140,0.15); color: var(--green); }
  .status-hired { background: var(--green-bg); color: var(--green); }
  .status-rejected { background: var(--red-bg); color: var(--red); }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .meta-chip { font-size: 10px; color: var(--text3); background: var(--bg); padding: 2px 6px; border-radius: 3px; }

  .detail { flex: 1; overflow-y: auto; padding: 24px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text3); gap: 10px; text-align: center; }
  .empty-icon { font-size: 42px; opacity: 0.25; }
  .empty-title { font-size: 15px; color: var(--text2); font-weight: 500; }
  .empty-sub { font-size: 13px; max-width: 300px; line-height: 1.6; }
  .drop-zone {
    border: 2px dashed var(--border2); border-radius: 12px; padding: 32px;
    text-align: center; margin-top: 24px; cursor: pointer; transition: all 0.2s; max-width: 400px;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--purple-bg); }
  .drop-zone-icon { font-size: 28px; margin-bottom: 8px; }
  .drop-zone-text { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .drop-zone-sub { font-size: 11px; color: var(--text3); }
  .drop-zone input { display: none; }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .detail-name { font-size: 21px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 3px; }
  .detail-sub { font-size: 12px; color: var(--text2); }
  .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status-select {
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px;
    padding: 7px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; outline: none;
  }
  .btn { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; font-weight: 500; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); }
  .btn-danger { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }

  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .info-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; }
  .info-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .info-value { font-size: 13px; color: var(--text); font-weight: 500; }
  .salary-highlight { font-family: 'DM Mono', monospace; color: var(--green); }
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; margin-top: 18px; }
  .answer-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 13px 15px; margin-bottom: 8px; }
  .answer-a { font-size: 13px; color: var(--text); line-height: 1.65; }
  .notes-area {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; resize: vertical; min-height: 80px; outline: none; line-height: 1.6;
  }
  .notes-area:focus { border-color: var(--accent); }
  .save-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .saved-msg { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; }
  .saved-msg.show { opacity: 1; }
  .no-results { padding: 24px 16px; text-align: center; color: var(--text3); font-size: 13px; }
  .import-toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--surface2);
    border: 1px solid var(--green); border-radius: 8px; padding: 12px 16px;
    font-size: 13px; color: var(--green); z-index: 999; display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">Saf<span>hire</span></div>
    <div class="role-badge" id="role-label">ATS System</div>
  </div>
  <div class="header-right">
    <div class="header-stats">
      <div class="stat"><div class="stat-num" id="total-count">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" id="new-count">0</div><div class="stat-label">New</div></div>
      <div class="stat"><div class="stat-num" id="shortlisted-count">0</div><div class="stat-label">Shortlisted</div></div>
      <div class="stat"><div class="stat-num" id="hired-count">0</div><div class="stat-label">Hired</div></div>
    </div>
    <label class="upload-btn">
      ＋ Import Spreadsheet
      <input type="file" accept=".xlsx,.xls,.csv" onchange="handleFileUpload(event)">
    </label>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-top">
      <input class="search-box" type="text" placeholder="Search candidates..." id="search-input" oninput="renderList()">
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('New',this)">New</button>
        <button class="filter-btn" onclick="setFilter('Reviewing',this)">Reviewing</button>
        <button class="filter-btn" onclick="setFilter('Shortlisted',this)">Shortlisted</button>
        <button class="filter-btn" onclick="setFilter('Interviewed',this)">Interviewed</button>
        <button class="filter-btn" onclick="setFilter('Hired',this)">Hired</button>
        <button class="filter-btn" onclick="setFilter('Rejected',this)">Rejected</button>
      </div>
    </div>
    <div id="candidate-list"></div>
  </div>
  <div class="detail" id="detail-panel">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Welcome to Safhire ATS</div>
      <div class="empty-sub">Import your Google Form responses spreadsheet to get started. Any new spreadsheet you import will add to existing candidates automatically.</div>
      <label class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">⬆️</div>
        <div class="drop-zone-text">Click to upload or drag & drop</div>
        <div class="drop-zone-sub">Supports .xlsx, .xls, .csv exported from Google Sheets</div>
        <input type="file" accept=".xlsx,.xls,.csv" onchange="handleFileUpload(event)">
      </label>
    </div>
  </div>
</div>

<div class="import-toast" id="import-toast"></div>

<script>
let candidates = [];
let activeFilter = 'all';
let activeId = null;
let nextId = 0;

const COL_MAP = {
  'full name': 'name', 'name': 'name',
  'email address': 'email', 'email': 'email',
  'phone number': 'phone', 'phone': 'phone',
  'city/province': 'location', 'city': 'location', 'province': 'location', 'location': 'location',
  'are you currently based in south africa': 'sa_based',
  'can you commit to this schedule': 'est_hours', 'est hours': 'est_hours',
  'do you have a reliable internet': 'internet', 'reliable internet': 'internet',
  'how many years of experience': 'experience_years', 'years of experience': 'experience_years',
  'do you have experience writing': 'service_plan_exp', 'experience writing service': 'service_plan_exp',
  'which tools are you comfortable': 'tools', 'tools': 'tools',
  'briefly describe your most relevant': 'relevant_exp',
  'in 3': 'writing_sample', 'describe how you would approach': 'writing_sample',
  'upload your cv': 'cv', 'cv:': 'cv',
  'upload a short video': 'video', 'voice note': 'video',
  'expected monthly salary': 'salary', 'salary': 'salary',
  'are you available to start': 'available', 'available immediately': 'available',
  'what platform': 'platform', 'applying from': 'platform',
  'timestamp': 'timestamp'
};

function mapColumn(header) {
  if (!header) return null;
  const h = header.toLowerCase().trim();
  for (const [key, val] of Object.entries(COL_MAP)) {
    if (h.includes(key)) return val;
  }
  return null;
}

function loadSaved() {
  try {
    const saved = localStorage.getItem('safhire_ats_v2');
    if (saved) {
      const data = JSON.parse(saved);
      candidates = data.candidates || [];
      nextId = data.nextId || candidates.length;
    }
  } catch(e) {}
}

function saveData() {
  try { localStorage.setItem('safhire_ats_v2', JSON.stringify({ candidates, nextId })); } catch(e) {}
  updateStats();
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (rows.length < 2) { showToast('No data found in spreadsheet.', true); return; }

      const headers = rows[0].map(h => String(h));
      const mappedHeaders = headers.map(mapColumn);
      let added = 0, skipped = 0;

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.every(cell => !String(cell).trim())) continue;
        const obj = {};
        mappedHeaders.forEach((key, idx) => { if (key) obj[key] = String(row[idx] || '').trim(); });
        const name = obj.name || '';
        if (!name) { skipped++; continue; }
        const exists = candidates.find(c =>
          (obj.email && c.email && c.email.toLowerCase() === obj.email.toLowerCase()) ||
          c.name.toLowerCase() === name.toLowerCase()
        );
        if (exists) { skipped++; continue; }
        candidates.push({
          id: nextId++, name,
          email: obj.email || '', phone: obj.phone || '', location: obj.location || '',
          sa_based: obj.sa_based || '', est_hours: obj.est_hours || '', internet: obj.internet || '',
          experience_years: obj.experience_years || '', service_plan_exp: obj.service_plan_exp || '',
          tools: obj.tools || '', relevant_exp: obj.relevant_exp || '', writing_sample: obj.writing_sample || '',
          cv: obj.cv || '', video: obj.video || '',
          salary: formatSalary(obj.salary || ''),
          available: obj.available || '', platform: obj.platform || '',
          status: 'New', notes: ''
        });
        added++;
      }

      saveData(); renderList();
      if (added > 0) {
        showDetail(candidates[candidates.length - added].id);
        document.getElementById('role-label').textContent = 'Service Plan Writer';
      }
      showToast(`✓ ${added} candidate${added !== 1 ? 's' : ''} imported${skipped ? ` · ${skipped} duplicate${skipped !== 1 ? 's' : ''} skipped` : ''}`);
    } catch(err) {
      showToast('Could not read file. Try exporting as .xlsx from Google Sheets.', true);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function formatSalary(s) {
  if (!s) return '—';
  const num = parseFloat(s.toString().replace(/[^0-9.]/g, ''));
  if (!num) return s;
  return 'R' + num.toLocaleString('en-ZA');
}

function showToast(msg, isError) {
  const t = document.getElementById('import-toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  t.style.color = isError ? 'var(--red)' : 'var(--green)';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function statusClass(s) {
  return 'status-' + (s || 'new').toLowerCase().replace(/\s/g, '');
}

function renderList() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const list = document.getElementById('candidate-list');
  list.innerHTML = '';
  const filtered = candidates.filter(c => {
    const matchFilter = activeFilter === 'all' || c.status === activeFilter;
    const matchSearch = !q || c.name.toLowerCase().includes(q) ||
      (c.location||'').toLowerCase().includes(q) ||
      (c.experience_years||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
  if (!filtered.length) {
    list.innerHTML = `<div class="no-results">${candidates.length === 0 ? 'No candidates yet.<br>Import a spreadsheet to get started.' : 'No candidates match.'}</div>`;
    return;
  }
  filtered.forEach(c => {
    const div = document.createElement('div');
    div.className = 'candidate-card' + (activeId === c.id ? ' active' : '');
    div.onclick = () => showDetail(c.id);
    div.innerHTML = `
      <div class="card-top">
        <div><div class="cand-name">${c.name}</div><div class="cand-location">${c.location||'—'}</div></div>
        <span class="status-pill ${statusClass(c.status)}">${c.status}</span>
      </div>
      <div class="card-meta">
        ${c.experience_years?`<span class="meta-chip">${c.experience_years}</span>`:''}
        ${c.salary&&c.salary!=='—'?`<span class="meta-chip">${c.salary}</span>`:''}
        ${c.video?'<span class="meta-chip">📹</span>':''}
      </div>`;
    list.appendChild(div);
  });
}

function updateStats() {
  document.getElementById('total-count').textContent = candidates.length;
  document.getElementById('new-count').textContent = candidates.filter(c=>c.status==='New').length;
  document.getElementById('shortlisted-count').textContent = candidates.filter(c=>c.status==='Shortlisted').length;
  document.getElementById('hired-count').textContent = candidates.filter(c=>c.status==='Hired').length;
}

function showDetail(id) {
  if (id === undefined || id === null) return;
  activeId = id;
  const c = candidates.find(c=>c.id===id);
  if (!c) return;
  renderList();
  const fields = [
    ['sa_based','Based in SA'],['est_hours','EST Hours'],['internet','Internet & Workspace'],
    ['experience_years','Experience'],['service_plan_exp','Service Plan Exp.'],
    ['available','Available Now'],['platform','Applied Via']
  ];
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${c.name}</div>
        <div class="detail-sub">${[c.email,c.phone,c.location].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="detail-actions">
        <select class="status-select" onchange="updateStatus(${c.id},this.value)">
          ${['New','Reviewing','Shortlisted','Interviewed','Hired','Rejected'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        ${c.cv?`<button class="btn btn-ghost" onclick="window.open('${c.cv}','_blank')">View CV</button>`:''}
        ${c.video?`<button class="btn btn-ghost" onclick="window.open('${c.video}','_blank')">View Video</button>`:''}
        <button class="btn btn-danger" onclick="deleteCandidate(${c.id})">Remove</button>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-box"><div class="info-label">Expected Salary</div><div class="info-value salary-highlight">${c.salary}/mo</div></div>
      ${fields.filter(([k])=>c[k]).map(([k,label])=>`<div class="info-box"><div class="info-label">${label}</div><div class="info-value">${c[k]}</div></div>`).join('')}
    </div>
    ${c.tools?`<div class="section-title">Tools</div><div class="answer-block"><div class="answer-a">${c.tools}</div></div>`:''}
    ${c.relevant_exp?`<div class="section-title">Relevant Experience</div><div class="answer-block"><div class="answer-a">${c.relevant_exp}</div></div>`:''}
    ${c.writing_sample?`<div class="section-title">Writing Sample</div><div class="answer-block"><div class="answer-a">${c.writing_sample}</div></div>`:''}
    <div class="section-title">Notes</div>
    <textarea class="notes-area" id="notes-${c.id}" placeholder="Add your notes about this candidate...">${c.notes||''}</textarea>
    <div class="save-row">
      <button class="btn btn-primary" onclick="saveNote(${c.id})">Save Note</button>
      <span class="saved-msg" id="saved-msg-${c.id}">Saved!</span>
    </div>`;
}

function updateStatus(id, status) {
  const c = candidates.find(c=>c.id===id);
  if (c) { c.status=status; saveData(); renderList(); }
}

function saveNote(id) {
  const c = candidates.find(c=>c.id===id);
  if (c) {
    c.notes = document.getElementById('notes-'+id).value;
    saveData();
    const msg = document.getElementById('saved-msg-'+id);
    msg.classList.add('show');
    setTimeout(()=>msg.classList.remove('show'), 2000);
  }
}

function deleteCandidate(id) {
  if (!confirm('Remove this candidate?')) return;
  candidates = candidates.filter(c=>c.id!==id);
  activeId = null; saveData(); renderList();
  document.getElementById('detail-panel').innerHTML = `<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-title">Candidate removed</div><div class="empty-sub">Select another candidate from the list.</div></div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const dz = document.getElementById('drop-zone');
  if (dz) {
    dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag-over');});
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFileUpload({target:{files:[file],value:''}});
    });
  }
});

loadSaved(); renderList(); updateStats();
</script>
</body>
</html>
